<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>GlobalChat</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f; --surface: #12121a; --surface2: #1a1a26;
    --accent: #00ff88; --accent2: #ff3366;
    --text: #e8e8f0; --border: #2a2a40;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Syne',sans-serif; background:var(--bg); color:var(--text); height:100vh; overflow:hidden; }

  .chat-screen { display:flex; flex-direction:column; height:100vh; }
  .chat-header { background:var(--surface); padding:12px 16px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--border); }
  
  .messages-container { 
    flex:1; 
    overflow-y: auto; 
    padding:16px; 
    display:flex; 
    flex-direction:column; 
    gap:12px; 
    background:var(--bg); 
    max-width: 680px; 
    margin: 0 auto; 
    width: 100%;
    scroll-behavior: smooth;
  }
  
  .msg { max-width: 82%; }
  .msg.own { align-self: flex-end; }
  .msg.other { align-self: flex-start; }
  
  .msg-bubble { 
    padding: 13px 17px; 
    border-radius: 18px; 
    font-size: 15.5px; 
    line-height: 1.45; 
    word-break: break-word; 
  }
  .msg.other .msg-bubble { background: var(--surface2); border: 1px solid var(--border); border-bottom-left-radius: 6px; }
  .msg.own .msg-bubble { background: linear-gradient(135deg, #1a3a2a, #0f2a1a); border: 1px solid rgba(0,255,136,0.4); border-bottom-right-radius: 6px; }

  .msg img {
    max-width: 100%;
    max-height: 380px;
    border-radius: 12px;
    margin-top: 8px;
    cursor: pointer;
  }

  .chat-input-area { 
    background: var(--surface); 
    border-top: 1px solid var(--border); 
    padding: 12px 16px; 
    display: flex; 
    gap: 10px; 
    max-width: 680px; 
    margin: 0 auto; 
    width: 100%;
  }
  .chat-input { 
    flex: 1; 
    background: var(--surface2); 
    border: 1px solid var(--border); 
    border-radius: 16px; 
    color: var(--text); 
    padding: 14px 18px; 
    font-size: 16px; 
    resize: none; 
    max-height: 160px; 
  }
  .send-btn, .attach-btn { 
    background: var(--accent); 
    color: #000; 
    width: 52px; 
    height: 52px; 
    border-radius: 16px; 
    font-size: 22px; 
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .attach-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    font-size: 24px;
  }
</style>
</head>
<body>

<div class="chat-screen" id="chat-screen">
  <div class="chat-header">
    <div><strong>GlobalChat</strong> <span style="color:#00ff88">● Live</span></div>
    <div style="display:flex; align-items:center; gap:10px;">
      <span id="display-user"></span>
      <button onclick="logout()" style="background:#222; border:none; color:#aaa; padding:6px 12px; border-radius:8px; font-size:13px;">Abmelden</button>
      <button id="admin-clear" onclick="confirmClearAll()" style="display:none; background:#ff3366; color:white; border:none; padding:6px 12px; border-radius:8px; font-size:13px;">Alles löschen</button>
    </div>
  </div>
  
  <div class="messages-container" id="messages"></div>
  
  <div class="chat-input-area">
    <input type="file" id="image-input" accept="image/*" style="display:none" onchange="handleImageSelect(event)">
    <button class="attach-btn" onclick="document.getElementById('image-input').click()">📎</button>
    <textarea id="chat-input" class="chat-input" placeholder="Nachricht schreiben... (/my)" onkeydown="handleKey(event)"></textarea>
    <button class="send-btn" onclick="sendMessage()">➤</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-storage-compat.js"></script>

<script>
// === Firebase Config ===
const firebaseConfig = {
  apiKey: "AIzaSyBYcwvQazKQxBQjdWqn4wLY-3SA3A4scng",
  authDomain: "globalchat-2026.firebaseapp.com",
  projectId: "globalchat-2026",
  storageBucket: "globalchat-2026.firebasestorage.app",
  messagingSenderId: "510911567824",
  appId: "1:510911567824:web:d95c7e0c5a88501fa3cbd5"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const storage = firebase.storage();

let currentUser = "", isAdmin = false, unsubscribe = null;

window.onload = () => {
  const pin = prompt("PIN eingeben:");
  if (pin === null || pin.length === 0) {
    location.reload();
    return;
  }
  
  isAdmin = (pin === "6767" || pin === "7676");
  currentUser = isAdmin ? "Admin" : prompt("Dein Name:");
  
  document.getElementById("display-user").textContent = isAdmin ? "👑 Admin" : currentUser;
  document.getElementById("admin-clear").style.display = isAdmin ? "block" : "none";
  
  initChat();
};

async function initChat() {
  unsubscribe = db.collection("messages").orderBy("time", "asc").onSnapshot(snap => {
    const container = document.getElementById("messages");
    container.innerHTML = "";
    
    snap.forEach(doc => {
      const m = doc.data();
      const div = document.createElement("div");
      div.className = `msg ${m.user === currentUser ? "own" : "other"}`;
      const time = new Date(m.time).toLocaleTimeString('de-DE', {hour:'2-digit', minute:'2-digit'});

      let content = `<div class="msg-bubble">${m.text || ""}</div>`;
      
      if (m.imageUrl) {
        content += `<img src="${m.imageUrl}" onclick="window.open(this.src)" alt="Bild">`;
      }

      div.innerHTML = `
        <div style="font-size:12.5px; opacity:0.75; margin-bottom:4px;">${m.user} • ${time}</div>
        ${content}
      `;
      container.appendChild(div);
    });
    container.scrollTop = container.scrollHeight;
  });
}

async function sendMessage(imageUrl = null) {
  const input = document.getElementById("chat-input");
  const text = input.value.trim();

  if (!text && !imageUrl) return;

  await db.collection("messages").add({ 
    user: currentUser, 
    text: text || "",
    imageUrl: imageUrl,
    time: Date.now() 
  });

  input.value = "";
}

let selectedFile = null;

function handleImageSelect(e) {
  selectedFile = e.target.files[0];
  if (!selectedFile) return;

  if (selectedFile.size > 10 * 1024 * 1024) {
    alert("Bild darf maximal 10 MB groß sein!");
    selectedFile = null;
    return;
  }

  // Sofort hochladen und senden
  uploadAndSendImage();
}

async function uploadAndSendImage() {
  if (!selectedFile) return;

  const loadingMsg = document.createElement("div");
  loadingMsg.textContent = "Bild wird hochgeladen...";
  loadingMsg.style.opacity = "0.6";
  document.getElementById("messages").appendChild(loadingMsg);

  try {
    const fileName = Date.now() + "_" + selectedFile.name;
    const ref = storage.ref("chat-images/" + fileName);
    
    await ref.put(selectedFile);
    const downloadURL = await ref.getDownloadURL();

    await sendMessage(downloadURL);
  } catch (err) {
    console.error(err);
    alert("Fehler beim Hochladen des Bildes.");
  }

  selectedFile = null;
  document.getElementById("image-input").value = "";
  loadingMsg.remove();
}

function handleKey(e) {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function logout() { location.reload(); }

function confirmClearAll() {
  if (confirm("Wirklich ALLE Nachrichten löschen?")) {
    db.collection("messages").get().then(s => s.forEach(d => d.ref.delete()));
  }
}
</script>
</body>
</html>
